<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моят DevOps Проект!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; max-width: 450px; width: 90%; border: 1px solid #334155; }
        .badge { background: #10b981; color: white; padding: 0.35rem 0.85rem; border-radius: 9999px; font-weight: bold; font-size: 0.75rem; display: inline-block; margin-bottom: 1.5rem; letter-spacing: 0.05em; }
        h1 { font-size: 2.2rem; margin-bottom: 0.75rem; color: #ffffff; font-weight: 800; }
        p { color: #94a3b8; font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; }
        .tech-stack { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .tech { background: #334155; color: #38bdf8; padding: 0.4rem 0.75rem; border-radius: 0.5rem; font-size: 0.8rem; font-family: monospace; font-weight: 600; border: 1px solid #475569; }
        .btn { display: inline-block; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; padding: 0.85rem 2rem; border-radius: 0.5rem; text-decoration: none; font-weight: 600; transition: all 0.2s ease; width: 100%; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4); }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">● DEPLOYED TO AZURE</span>
        <h1>Моят CI/CD Проект</h1>
        <div class="tech-stack">
            <span class="tech">Docker</span>
            <span class="tech">GitHub Actions</span>
            <span class="tech">Azure</span>
            <span class="tech">Nginx</span>
        </div>
        <a href="https://github.com/YasenaPetrova" target="_blank" class="btn">Виж моя GitHub профил</a>
    </div>
</body>
</html>
